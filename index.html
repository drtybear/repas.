<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c2451f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>repas.</title>
<style>
:root{
  --bg:#faf5ec; --card:#fffdf8; --ink:#27211b; --muted:#8a7f72;
  --accent:#c2451f; --accent-soft:#f6e3d9; --olive:#5d6e44; --olive-soft:#e8ecdc;
  --honey:#b4842c; --honey-soft:#f5ecd8; --night:#5b5e8d; --night-soft:#e6e7f2;
  --line:#e8dfd2; --danger:#a33327; --r:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45; }
#app{ max-width:560px; margin:0 auto; padding:14px 16px calc(34px + env(safe-area-inset-bottom)); min-height:100vh; }
.topbar{ display:flex; align-items:center; gap:10px; padding:8px 0 16px; }
.back{ border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:8px 13px; font-size:15px; font-weight:600; cursor:pointer; }
.brand{ font-size:30px; font-weight:800; letter-spacing:-0.5px; }
.brand b{ color:var(--accent); }
.screen-title{ font-size:22px; font-weight:800; letter-spacing:-0.3px; }
h2.sec{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--muted); margin:20px 0 8px; }
.card{ background:var(--card); border:1.5px solid var(--line); border-radius:var(--r);
  padding:14px 16px; margin-bottom:10px; }
.navcard{ display:flex; align-items:center; gap:14px; cursor:pointer; transition:transform .06s; }
.navcard:active{ transform:scale(.985); }
.navcard .ico{ font-size:26px; width:44px; height:44px; display:flex; align-items:center;
  justify-content:center; border-radius:13px; background:var(--accent-soft); flex-shrink:0; }
.navcard .t{ font-weight:700; font-size:17px; }
.navcard .s{ color:var(--muted); font-size:13.5px; }
.navcard .chev{ margin-left:auto; color:var(--muted); font-size:20px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid2 .card{ margin-bottom:0; }
button.primary{ width:100%; border:none; background:var(--accent); color:#fff; font-size:16.5px;
  font-weight:700; padding:14px; border-radius:14px; cursor:pointer; }
button.ghost{ width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  font-size:15.5px; font-weight:600; padding:12px; border-radius:14px; cursor:pointer; }
button:disabled{ opacity:.45; }
input[type=text], input[type=number], input[type=search], textarea, select{
  width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:11px 12px; font-size:16px; font-family:inherit; }
textarea{ resize:vertical; min-height:54px; }
input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
.pill{ display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; }
.pill.entree{ background:var(--olive-soft); color:var(--olive); }
.pill.plat{ background:var(--accent-soft); color:var(--accent); }
.pill.dessert{ background:var(--honey-soft); color:var(--honey); }
.pill.cantine{ background:var(--night-soft); color:var(--night); }
.pill.resto{ background:#efe6f5; color:#8d5fa8; }
.pill.autre{ background:#ece7df; color:#6f675c; }
.row{ display:flex; gap:8px; align-items:center; }
.note{ color:var(--muted); font-size:13.5px; }
.empty{ text-align:center; color:var(--muted); padding:26px 10px; font-size:14.5px; }

/* recettes */
.rcard{ cursor:pointer; }
.rhead{ display:flex; align-items:center; gap:10px; }
.rhead .name{ font-weight:700; font-size:16.5px; flex:1; }
.rbody{ margin-top:12px; border-top:1.5px dashed var(--line); padding-top:12px; }
.ing{ display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:15px; }
.ing .q{ color:var(--muted); white-space:nowrap; }
.ractions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.ractions button{ border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  font-size:14.5px; font-weight:600; padding:10px 6px; border-radius:12px; cursor:pointer; }
.ractions button.go{ background:var(--accent); border-color:var(--accent); color:#fff; grid-column:1 / -1; font-size:15.5px; padding:12px; }
.ractions button.warn{ color:var(--danger); }

/* cuisine */
.serves{ display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 2px; }
.serves button{ width:44px; height:44px; border-radius:13px; border:1.5px solid var(--line);
  background:var(--card); font-size:22px; font-weight:700; color:var(--accent); cursor:pointer; }
.serves .n{ font-size:18px; font-weight:800; min-width:120px; text-align:center; }
.step{ display:flex; gap:12px; align-items:flex-start; }
.step.done{ opacity:.55; }
.step.done .txt{ text-decoration:line-through; }
.chk{ width:26px; height:26px; border-radius:9px; border:2px solid var(--line); background:var(--card);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff; cursor:pointer; margin-top:1px; }
.step.done .chk{ background:var(--olive); border-color:var(--olive); }
.step .txt{ flex:1; font-size:15.5px; }
.tbtn{ margin-top:8px; border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  font-weight:700; font-size:14.5px; padding:7px 13px; border-radius:99px; cursor:pointer; font-variant-numeric:tabular-nums; }
.tbtn.run{ background:var(--accent); color:#fff; }
.tbtn.over{ background:var(--olive); border-color:var(--olive); color:#fff; }
.progress{ height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin:10px 0 16px; }
.progress i{ display:block; height:100%; background:var(--olive); border-radius:99px; transition:width .25s; }

/* calendrier */
.weeknav{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.weeknav button{ width:44px; height:40px; border:1.5px solid var(--line); background:var(--card);
  border-radius:12px; font-size:18px; cursor:pointer; color:var(--ink); }
.weeknav .lbl{ flex:1; text-align:center; font-weight:700; font-size:15.5px; }
.day{ padding:12px 14px; }
.day.today{ border-color:var(--accent); border-width:2px; }
.day .dn{ font-weight:800; font-size:15px; margin-bottom:8px; }
.day .dn small{ color:var(--muted); font-weight:600; margin-left:6px; }
.slots{ display:grid; gap:6px; }
.slot{ display:flex; align-items:center; gap:9px; border:1.5px solid var(--line); border-radius:11px;
  padding:8px 11px; cursor:pointer; background:var(--bg); }
.slot .dot{ width:10px; height:10px; border-radius:99px; flex-shrink:0; }
.slot .sl{ font-size:12px; font-weight:700; color:var(--muted); width:52px; flex-shrink:0; }
.slot .sv{ font-size:14.5px; font-weight:600; flex:1; }
.slot .sv.none{ color:var(--muted); font-weight:500; }
.dot.m{ background:var(--honey); } .dot.d{ background:var(--accent); } .dot.s{ background:var(--night); }

/* listes frigo / congel / courses */
.item{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1.5px dashed var(--line); }
.item:last-child{ border-bottom:none; }
.item .nm{ flex:1; font-size:15.5px; }
.item .qy{ color:var(--muted); font-size:14px; white-space:nowrap; }
.item.done .nm{ text-decoration:line-through; color:var(--muted); }
.iconbtn{ border:1.5px solid var(--line); background:var(--bg); border-radius:10px; width:34px; height:34px;
  font-size:14px; cursor:pointer; flex-shrink:0; color:var(--ink); padding:0; }
.iconbtn.del{ color:var(--danger); }
.addrow{ display:flex; gap:8px; margin-bottom:14px; }
.addrow input{ flex:1; }
.addrow button{ border:none; background:var(--accent); color:#fff; border-radius:12px; width:50px;
  font-size:22px; font-weight:700; cursor:pointer; flex-shrink:0; }

/* éditeur */
.seg{ display:flex; gap:6px; flex-wrap:wrap; }
.seg button{ flex:1 1 30%; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  padding:10px 4px; border-radius:12px; font-size:14.5px; font-weight:600; cursor:pointer; }
.seg button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px;
  text-transform:uppercase; letter-spacing:0.05em; }
.ingrow{ display:flex; gap:6px; margin-bottom:6px; }
.ingrow .i-n{ flex:3; } .ingrow .i-q{ flex:1.1; min-width:0; } .ingrow .i-u{ flex:1.3; min-width:0; }
.steprow{ display:flex; gap:6px; margin-bottom:6px; align-items:flex-start; }
.steprow .stepmove{ display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0; padding-top:4px; }
.steprow .num{ width:24px; text-align:center; font-weight:800; color:var(--muted); }
.steprow .mv{ border:1.5px solid var(--line); background:var(--card); color:var(--accent); border-radius:8px;
  width:26px; height:22px; font-size:11px; cursor:pointer; padding:0; line-height:1; }
.steprow .mv:disabled{ opacity:.3; cursor:default; }
.steprow textarea{ flex:1; }
.steprow .t-m{ width:74px; flex-shrink:0; }
.rm{ border:none; background:none; color:var(--danger); font-size:17px; cursor:pointer; padding:10px 4px; flex-shrink:0; }

/* options */
.optrow{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1.5px dashed var(--line); }
.optrow:last-child{ border-bottom:none; }
.optrow .ot{ flex:1; } .optrow .ot b{ display:block; font-size:15.5px; }
.optrow .ot span{ color:var(--muted); font-size:13px; }
.switch{ width:52px; height:30px; border-radius:99px; background:var(--line); position:relative;
  cursor:pointer; flex-shrink:0; border:none; transition:background .15s; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:24px; height:24px;
  border-radius:99px; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.switch.on{ background:var(--olive); } .switch.on::after{ left:25px; }

/* overlay picker */
.overlay{ position:fixed; inset:0; background:rgba(39,33,27,.45); display:flex; align-items:flex-end;
  justify-content:center; z-index:50; }
.sheet{ background:var(--bg); border-radius:20px 20px 0 0; width:100%; max-width:560px;
  max-height:82vh; overflow-y:auto; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h3{ font-size:17px; font-weight:800; margin-bottom:12px; }
.pickitem{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1.5px dashed var(--line);
  cursor:pointer; font-size:15.5px; font-weight:600; }
.searchbar{ margin-bottom:12px; }
.toast{ position:fixed; left:50%; bottom:34px; transform:translate(-50%, 16px); background:var(--ink); color:#fff;
  padding:10px 18px; border-radius:99px; font-size:14.5px; font-weight:600; opacity:0; transition:all .25s;
  z-index:99; max-width:88%; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.25); }
.toast.show{ opacity:1; transform:translate(-50%, 0); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ stockage ============ */
const MEM = {};
function lsGet(k, def){
  try{ const v = localStorage.getItem('repas:'+k); return v===null ? (k in MEM ? MEM[k] : def) : JSON.parse(v); }
  catch(e){ return k in MEM ? MEM[k] : def; }
}
function lsSet(k, v){
  MEM[k] = v;
  try{ localStorage.setItem('repas:'+k, JSON.stringify(v)); }catch(e){}
}

/* ============ données ============ */
const TYPES = { entree:'Entrée', plat:'Plat', dessert:'Dessert', cantine:'Cantine', resto:'Resto', autre:'Autre' };
const SLOTS = [ {k:'m', lbl:'Matin', cls:'m'}, {k:'d', lbl:'Midi', cls:'d'}, {k:'s', lbl:'Soir', cls:'s'} ];
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

function seedRecipes(){
  return [
    { id:'r1', name:'Pâtes à la carbonara', type:'plat', serves:2, created:Date.now(),
      ings:[ {n:'Spaghetti', q:200, u:'g'}, {n:'Lardons', q:150, u:'g'}, {n:'Œufs', q:2, u:''}, {n:'Parmesan râpé', q:50, u:'g'}, {n:'Poivre', q:null, u:''} ],
      steps:[ {t:'Porter une grande casserole d\'eau salée à ébullition.', m:null},
              {t:'Cuire les spaghetti.', m:10},
              {t:'Pendant ce temps, faire revenir les lardons à sec dans une poêle.', m:5},
              {t:'Battre les œufs avec le parmesan et beaucoup de poivre.', m:null},
              {t:'Égoutter les pâtes (garder un peu d\'eau), mélanger hors du feu avec les lardons puis le mélange œufs-parmesan.', m:null} ] },
    { id:'r2', name:'Soupe de légumes', type:'entree', serves:4, created:Date.now(),
      ings:[ {n:'Carottes', q:3, u:''}, {n:'Pommes de terre', q:2, u:''}, {n:'Poireau', q:1, u:''}, {n:'Oignon', q:1, u:''}, {n:'Bouillon de légumes', q:1, u:'cube'} ],
      steps:[ {t:'Éplucher et couper tous les légumes en morceaux.', m:null},
              {t:'Faire revenir l\'oignon dans un peu d\'huile.', m:3},
              {t:'Ajouter les légumes, couvrir d\'eau, ajouter le bouillon.', m:null},
              {t:'Laisser mijoter à couvert.', m:25},
              {t:'Mixer et ajuster l\'assaisonnement.', m:null} ] },
    { id:'r3', name:'Crumble aux pommes', type:'dessert', serves:4, created:Date.now(),
      ings:[ {n:'Pommes', q:4, u:''}, {n:'Farine', q:150, u:'g'}, {n:'Beurre froid', q:100, u:'g'}, {n:'Sucre', q:100, u:'g'} ],
      steps:[ {t:'Préchauffer le four à 180 °C.', m:null},
              {t:'Éplucher et couper les pommes, les répartir dans un plat.', m:null},
              {t:'Mélanger farine, sucre et beurre du bout des doigts pour obtenir un sable grossier.', m:null},
              {t:'Répartir le crumble sur les pommes et enfourner.', m:35} ] }
  ];
}
let recipes = lsGet('recipes', null);
if(!recipes){ recipes = seedRecipes(); lsSet('recipes', recipes); }
let plan = lsGet('plan', {});
const STORES = {
  frigo:  { lbl:'Frigo',   ico:'\u{1F9CA}' },
  congel: { lbl:'Congel',  ico:'\u2744\uFE0F' },
  placard:{ lbl:'Placard', ico:'\u{1F96B}' },
  autre:  { lbl:'Autre',   ico:'\u{1F4E6}' }
};
let stores = lsGet('stores', null);
if(!stores){
  stores = { frigo: lsGet('frigo', []) || [], congel: lsGet('congel', []) || [], placard: [], autre: [] };
  lsSet('stores', stores);
}
Object.keys(STORES).forEach(k=>{ if(!Array.isArray(stores[k])) stores[k] = []; });
let active = Object.assign({ frigo:true, congel:true, placard:false, autre:false }, lsGet('activeStores', {}) || {});
let courses = lsGet('courses', []);

function loadPref(k, def){ try{ const v = localStorage.getItem('repas:pref:'+k); return v===null?def:v==='1'; }catch(e){ return def; } }
function savePref(k, v){ try{ localStorage.setItem('repas:pref:'+k, v?'1':'0'); }catch(e){} }
let prefs = { vib: loadPref('vib', true), son: loadPref('son', true), veille: loadPref('veille', true) };

/* ============ utilitaires ============ */
const app = document.getElementById('app');
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtQ(q){
  if(q===null || q===undefined || q==='') return '';
  const v = Math.round(q*100)/100;
  return String(v).replace('.', ',');
}
function buzz(p){ if(prefs.vib && navigator.vibrate){ try{ navigator.vibrate(p||40); }catch(e){} } }
let audioCtx = null;
let audioPrimed = false;
function primeAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(audioCtx.state==='running') audioPrimed = true;
  }catch(e){}
}
document.addEventListener('pointerdown', primeAudio, { passive:true });
document.addEventListener('touchstart', primeAudio, { passive:true });
document.addEventListener('click', primeAudio);
function beep(times){
  if(!prefs.son) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const n = times||3;
    for(let i=0;i<n;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 880; o.type = 'sine';
      const t = audioCtx.currentTime + i*0.35;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      o.start(t); o.stop(t+0.3);
    }
  }catch(e){}
}
let wakeLock = null;
async function lockScreen(){
  if(!prefs.veille) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockScreen(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && wakeLock===null && inCook) lockScreen(); });

let cookTimers = {};
let inCook = false;
function clearTimers(){ Object.values(cookTimers).forEach(t=>clearInterval(t.int)); cookTimers = {}; }
function leaveCook(){ clearTimers(); unlockScreen(); inCook = false; }

function topbar(title){
  const tb = document.createElement('div');
  tb.className = 'topbar';
  tb.innerHTML = '<button class="back">‹ Retour</button><div class="screen-title">'+esc(title)+'</div>';
  tb.querySelector('.back').onclick = goBack;
  return tb;
}
function closeOverlay(){ const o = document.querySelector('.overlay'); if(o) o.remove(); }

/* ============ navigation (bouton retour + geste du téléphone) ============ */
let stack = [{ screen:'home' }];
let histOK = false;
try{ history.replaceState({ i:0 }, ''); histOK = !!(history.state && history.state.i===0); }catch(e){}
let fromPop = false;
let ignorePop = false;
function pushScreen(st){
  if(fromPop){ fromPop = false; return; }
  stack.push(st);
  if(histOK){ try{ history.pushState({ i: stack.length-1 }, ''); }catch(e){} }
}
function renderState(st){
  fromPop = true;
  st = st || { screen:'home' };
  if(st.screen==='cal') calScreen(st.offset||0);
  else if(st.screen==='recipes') recipesScreen(st.q||'');
  else if(st.screen==='edit') editScreen(st.id||null);
  else if(st.screen==='cook') cookScreen(st.id);
  else if(st.screen==='list') listScreen(st.kind||'frigo');
  else if(st.screen==='courses') coursesScreen();
  else if(st.screen==='settings') settingsScreen();
  else home();
}
function backInternal(){
  const o = document.querySelector('.overlay');
  if(o){ o.remove(); renderState(stack[stack.length-1]); return true; }
  if(stack.length>1){ stack.pop(); renderState(stack[stack.length-1]); return true; }
  return false;
}
function goBack(){
  const did = backInternal();
  if(did && histOK){
    ignorePop = true;
    try{ history.back(); }catch(e){}
    setTimeout(()=>{ ignorePop = false; }, 400);
  }
}
window.addEventListener('popstate', ()=>{
  if(ignorePop){ ignorePop = false; return; }
  backInternal();
});

/* ============ petits outils d'interface ============ */
function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2000);
}
function storeSheet(title, exclude, cb){
  const opts = Object.keys(STORES).filter(k=>active[k] && k!==exclude);
  if(!opts.length){ toast('Aucune autre liste active (voir Options)'); return; }
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3>
    ${opts.map(x=>`<div class="pickitem" data-st="${x}"><span style="font-size:20px">${STORES[x].ico}</span> ${STORES[x].lbl}</div>`).join('')}
    <button class="ghost" style="margin-top:12px" id="ss-close">Annuler</button></div>`;
  document.body.appendChild(ov);
  if(histOK){ try{ history.pushState({ i: stack.length-1, ov:1 }, ''); }catch(e){} }
  ov.onclick = e=>{ if(e.target===ov) goBack(); };
  ov.querySelectorAll('[data-st]').forEach(p=>{ p.onclick = ()=>{ cb(p.dataset.st); goBack(); }; });
  ov.querySelector('#ss-close').onclick = ()=>goBack();
}

/* ============ accueil ============ */
function home(){
  leaveCook(); closeOverlay();
  pushScreen({ screen:'home' });
  const nC = courses.filter(c=>!c.done).length;
  const todayKey = isoDate(new Date());
  const tp = plan[todayKey] || {};
  const nToday = SLOTS.filter(s=>tp[s.k]).length;

/* ============ recettes ============ */
let openRecipe = null;
function norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function matchRecipe(r, q){
  if(!q) return true;
  const s = norm(q);
  if(norm(r.name).includes(s)) return true;
  return r.ings.some(i=>norm(i.n).includes(s));
}
function recipesScreen(query){
  leaveCook(); closeOverlay();
  pushScreen({ screen:'recipes', q:query||'' });
  app.innerHTML = '';
  app.appendChild(topbar('Mes recettes'));
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="searchbar"><input type="search" id="rq" placeholder="Rechercher un nom ou un aliment…" value="${esc(query)}"></div>
    <button class="primary" id="newR" style="margin-bottom:14px">+ Nouvelle recette</button>
    <div id="rlist"></div>`;
  app.appendChild(box);
  document.getElementById('newR').onclick = ()=>editScreen(null);
  const inp = document.getElementById('rq');
  inp.oninput = ()=>renderList(inp.value);
  function renderList(q){
    const list = document.getElementById('rlist');
    const found = recipes.filter(r=>matchRecipe(r,q)).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    if(!found.length){ list.innerHTML = '<div class="empty">Aucune recette ne correspond.<br>Ajoute-la avec le bouton ci-dessus !</div>'; return; }
    list.innerHTML = found.map(r=>{
      const open = openRecipe===r.id;
      return `<div class="card rcard" data-id="${r.id}">
        <div class="rhead">
          <span class="name">${esc(r.name)}</span>
          <span class="pill ${r.type}">${TYPES[r.type]||''}</span>
        </div>
        ${open ? `<div class="rbody">
          <div class="note" style="margin-bottom:8px">Pour ${r.serves} personne${r.serves>1?'s':''} · ${r.steps.length} étape${r.steps.length>1?'s':''}</div>
          ${r.ings.map(i=>`<div class="ing"><span>${esc(i.n)}</span><span class="q">${fmtQ(i.q)}${i.u?' '+esc(i.u):''}</span></div>`).join('')}
          <div class="ractions">
            <button class="go" data-cook="${r.id}">▶ Cuisiner</button>
            <button data-buy="${r.id}">🛒 + courses</button>
            <button data-share="${r.id}">📤 Partager</button>
            <button data-edit="${r.id}">✏️ Modifier</button>
            <button class="warn" data-del="${r.id}" style="grid-column:1 / -1">🗑 Supprimer</button>
          </div>
        </div>` : ''}
      </div>`;
    }).join('');
    list.querySelectorAll('.rcard').forEach(c=>{
      c.querySelector('.rhead').onclick = ()=>{
        openRecipe = openRecipe===c.dataset.id ? null : c.dataset.id;
        renderList(document.getElementById('rq').value);
      };
    });
    list.querySelectorAll('[data-cook]').forEach(b=>{ b.onclick = e=>{ e.stopPropagation(); cookScreen(b.dataset.cook); }; });
    list.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick = e=>{ e.stopPropagation(); editScreen(b.dataset.edit); }; });
    list.querySelectorAll('[data-buy]').forEach(b=>{ b.onclick = e=>{
      e.stopPropagation();
      const r = recipes.find(x=>x.id===b.dataset.buy);
      if(r){ const n = addIngsToCourses(r); buzz(30); b.textContent = '✓ Ajouté ('+n+')'; setTimeout(()=>{ b.textContent='🛒 + courses'; }, 1600); }
    }; });
    list.querySelectorAll('[data-share]').forEach(b=>{ b.onclick = e=>{
      e.stopPropagation();
      const r = recipes.find(x=>x.id===b.dataset.share);
      if(r) shareRecipe(r);
    }; });
    list.querySelectorAll('[data-del]').forEach(b=>{ b.onclick = e=>{
      e.stopPropagation();
      const r = recipes.find(x=>x.id===b.dataset.del);
      if(r && confirm('Supprimer « '+r.name+' » ?')){
        recipes = recipes.filter(x=>x.id!==r.id); lsSet('recipes', recipes);
        openRecipe = null; renderList(document.getElementById('rq').value);
      }
    }; });
  }
  renderList(query);
}
function recipeToText(r){
  let s = r.name + '\n\n';
  s += 'Pour ' + r.serves + ' personne' + (r.serves>1?'s':'') + ' — ' + (TYPES[r.type]||'') + '\n\n';
  s += 'Ingrédients :\n';
  r.ings.forEach(i=>{ s += '\u2022 ' + i.n + ((i.q!==null&&i.q!==undefined&&i.q!=='')?' \u2014 '+fmtQ(i.q)+(i.u?' '+i.u:''):'') + '\n'; });
  s += '\nÉtapes :\n';
  r.steps.forEach((st,k)=>{ s += (k+1)+'. '+st.t + (st.m?' (\u23F1 '+st.m+' min)':'') + '\n'; });
  s += '\n\u2014 partagé depuis repas.';
  return s;
}
function slug(name){ return norm(name).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'recette'; }
function recipeFileObj(r){
  return { app:'repas', kind:'recipe', version:1,
    recipe:{ name:r.name, type:r.type, serves:r.serves, ings:r.ings, steps:r.steps } };
}
function downloadRecipe(r){
  const blob = new Blob([JSON.stringify(recipeFileObj(r), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug(r.name)+'.repas.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function shareRecipe(r){
  const txt = recipeToText(r);
  const json = JSON.stringify(recipeFileObj(r), null, 2);
  // 1) partage avec fichier (réimportable) si supporté
  try{
    const file = new File([json], slug(r.name)+'.repas.json', { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ title:r.name, text:txt, files:[file] });
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  // 2) partage texte simple
  try{
    if(navigator.share){ await navigator.share({ title:r.name, text:txt }); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  // 3) repli : copie + téléchargement du fichier
  try{ await navigator.clipboard.writeText(txt); }catch(e){}
  downloadRecipe(r);
  toast('Partage indispo : recette copiée + fichier téléchargé');
}
function parseRecipeFile(obj){
  let rec = null;
  if(obj && obj.kind==='recipe' && obj.recipe) rec = obj.recipe;
  else if(obj && obj.name && (obj.ings || obj.steps)) rec = obj;
  else if(obj && Array.isArray(obj.recipes) && obj.recipes.length) rec = obj.recipes[0];
  if(!rec) return null;
  return {
    id: uid(),
    name: String(rec.name||'').trim(),
    type: TYPES[rec.type] ? rec.type : 'plat',
    serves: Number(rec.serves)>0 ? Math.min(20, Math.round(Number(rec.serves))) : 2,
    ings: Array.isArray(rec.ings) ? rec.ings.map(i=>({ n:String(i.n||''), q:(i.q===null||i.q===undefined||i.q==='')?null:Number(i.q), u:String(i.u||'') })).filter(i=>i.n) : [],
    steps: Array.isArray(rec.steps) ? rec.steps.map(s=>({ t:String(s.t||''), m:(s.m&&Number(s.m)>0)?Number(s.m):null })).filter(s=>s.t) : [],
    created: Date.now()
  };
}
function addIngsToCourses(r){
  let added = 0;
  r.ings.forEach(i=>{
    const exists = courses.some(c=>!c.done && c.n.toLowerCase()===i.n.toLowerCase());
    if(!exists){ courses.push({ n:i.n, done:false }); added++; }
  });
  lsSet('courses', courses);
  return added;
}

/* ============ mode cuisine ============ */
function cookScreen(id){
  const r = recipes.find(x=>x.id===id);
  if(!r){ home(); return; }
  leaveCook(); closeOverlay();
  pushScreen({ screen:'cook', id:id });
  inCook = true; lockScreen();
  let serves = r.serves;
  const done = r.steps.map(()=>false);
  app.innerHTML = '';
  app.appendChild(topbar(r.name));
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="card">
      <div class="serves">
        <button id="c-sm">−</button>
        <div class="n" id="c-sn"></div>
        <button id="c-sp">+</button>
      </div>
      <div id="c-ings" style="margin-top:8px"></div>
    </div>
    <h2 class="sec">Étapes</h2>
    <div class="progress"><i id="c-prog" style="width:0%"></i></div>
    <div id="c-steps"></div>
    <button class="primary" id="c-finish" style="margin-top:8px">✓ Terminer</button>`;
  app.appendChild(box);

  function renderIngs(){
    document.getElementById('c-sn').textContent = serves + ' pers.';
    document.getElementById('c-ings').innerHTML = r.ings.map(i=>{
      const q = (i.q===null||i.q===undefined) ? null : i.q * serves / r.serves;
      return `<div class="ing"><span>${esc(i.n)}</span><span class="q">${q===null?'':fmtQ(q)}${i.u?' '+esc(i.u):''}</span></div>`;
    }).join('');
  }
  document.getElementById('c-sm').onclick = ()=>{ if(serves>1){ serves--; renderIngs(); } };
  document.getElementById('c-sp').onclick = ()=>{ if(serves<20){ serves++; renderIngs(); } };
  renderIngs();

  function fmtT(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + (s<10?'0':'') + s;
  }
  function renderSteps(){
    const b = document.getElementById('c-steps');
    b.innerHTML = r.steps.map((s,k)=>`
      <div class="card step ${done[k]?'done':''}" data-k="${k}">
        <button class="chk" data-k="${k}">${done[k]?'✓':''}</button>
        <div style="flex:1">
          <div class="txt">${esc(s.t)}</div>
          ${s.m ? `<button class="tbtn" data-t="${k}">⏱ ${s.m} min</button>` : ''}
        </div>
      </div>`).join('');
    b.querySelectorAll('.chk').forEach(c=>{ c.onclick = ()=>{
      const k = +c.dataset.k; done[k] = !done[k]; buzz(20);
      if(done[k] && cookTimers[k]){ clearInterval(cookTimers[k].int); delete cookTimers[k]; }
      const card = b.querySelector('.step[data-k="'+k+'"]');
      card.classList.toggle('done', done[k]); c.textContent = done[k]?'✓':'';
      updateProg();
    }; });
    b.querySelectorAll('[data-t]').forEach(tb=>{ tb.onclick = ()=>toggleTimer(+tb.dataset.t, tb); });
  }
  function updateProg(){
    const n = done.filter(Boolean).length;
    document.getElementById('c-prog').style.width = (r.steps.length ? n/r.steps.length*100 : 0) + '%';
  }
  function toggleTimer(k, btn){
    if(cookTimers[k]){
      clearInterval(cookTimers[k].int); delete cookTimers[k];
      btn.classList.remove('run','over'); btn.textContent = '⏱ ' + r.steps[k].m + ' min';
      return;
    }
    const end = Date.now() + r.steps[k].m*60000;
    btn.classList.add('run'); btn.classList.remove('over');
    const tick = ()=>{
      const left = (end - Date.now())/1000;
      if(left <= 0){
        clearInterval(cookTimers[k].int); delete cookTimers[k];
        btn.classList.remove('run'); btn.classList.add('over');
        btn.textContent = '✓ C\u2019est prêt !';
        beep(4); buzz([200,100,200,100,400]);
        return;
      }
      btn.textContent = '⏹ ' + fmtT(left);
    };
    cookTimers[k] = { int: setInterval(tick, 250) };
    tick();
  }
  renderSteps(); updateProg();
  document.getElementById('c-finish').onclick = ()=>{ buzz([60,40,60]); goBack(); };
}

/* ============ calendrier ============ */
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function weekStart(offset){
  const d = new Date(); d.setHours(0,0,0,0);
  const wd = (d.getDay()+6)%7; // lundi = 0
  d.setDate(d.getDate() - wd + offset*7);
  return d;
}
function calScreen(offset){
  leaveCook(); closeOverlay();
  pushScreen({ screen:'cal', offset:offset });
  app.innerHTML = '';
  app.appendChild(topbar('Calendrier'));
  const start = weekStart(offset);
  const end = new Date(start); end.setDate(end.getDate()+6);
  const lbl = offset===0 ? 'Cette semaine' : (offset===1 ? 'Semaine prochaine' : (offset===-1 ? 'Semaine dernière' :
    start.getDate()+' '+MONTHS[start.getMonth()]+' – '+end.getDate()+' '+MONTHS[end.getMonth()]));
  const box = document.createElement('div');
  let daysHtml = '';
  const todayKey = isoDate(new Date());
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const key = isoDate(d);
    const p = plan[key] || {};
    daysHtml += `<div class="card day ${key===todayKey?'today':''}">
      <div class="dn">${DAYS[i]} <small>${d.getDate()} ${MONTHS[d.getMonth()]}</small></div>
      <div class="slots">${SLOTS.map(s=>{
        const e = p[s.k];
        let label = '';
        if(e){
          if(e.rid){ const r = recipes.find(x=>x.id===e.rid); label = r ? r.name : '(recette supprimée)'; }
          else label = e.txt || '';
        }
        return `<div class="slot" data-d="${key}" data-s="${s.k}">
          <span class="dot ${s.cls}"></span><span class="sl">${s.lbl}</span>
          <span class="sv ${e?'':'none'}">${e?esc(label):'—'}</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  }
  box.innerHTML = `
    <div class="weeknav">
      <button id="w-prev">‹</button><div class="lbl">${lbl}</div><button id="w-next">›</button>
    </div>
    ${daysHtml}`;
  app.appendChild(box);
  document.getElementById('w-prev').onclick = ()=>calScreen(offset-1);
  document.getElementById('w-next').onclick = ()=>calScreen(offset+1);
  box.querySelectorAll('.slot').forEach(sl=>{ sl.onclick = ()=>pickMeal(sl.dataset.d, sl.dataset.s, offset); });
}
function pickMeal(dateKey, slotKey, offset){
  closeOverlay();
  const slot = SLOTS.find(s=>s.k===slotKey);
  const d = new Date(dateKey+'T12:00:00');
  const existing = (plan[dateKey]||{})[slotKey];
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet">
    <h3>${slot.lbl} · ${DAYS[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}</h3>
    <div class="searchbar"><input type="search" id="p-q" placeholder="Chercher une recette…"></div>
    <div id="p-list"></div>
    <h2 class="sec">Ou en texte libre</h2>
    <div class="addrow"><input type="text" id="p-txt" placeholder="Ex : Restes, pizza, resto…" value="${existing && existing.txt ? esc(existing.txt) : ''}"><button id="p-ok">✓</button></div>
    ${existing ? '<button class="ghost" id="p-rm" style="color:var(--danger)">Retirer ce repas</button>' : ''}
    <button class="ghost" id="p-close" style="margin-top:8px">Fermer</button>
  </div>`;
  document.body.appendChild(ov);
  if(histOK){ try{ history.pushState({ i: stack.length-1, ov:1 }, ''); }catch(e){} }
  ov.onclick = e=>{ if(e.target===ov) goBack(); };
  function setEntry(entry){
    if(!plan[dateKey]) plan[dateKey] = {};
    if(entry) plan[dateKey][slotKey] = entry; else delete plan[dateKey][slotKey];
    if(!Object.keys(plan[dateKey]).length) delete plan[dateKey];
    lsSet('plan', plan);
    buzz(25);
    goBack();
  }
  function renderPick(q){
    const found = recipes.filter(r=>matchRecipe(r,q)).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    document.getElementById('p-list').innerHTML = found.length
      ? found.map(r=>`<div class="pickitem" data-id="${r.id}"><span class="pill ${r.type}">${TYPES[r.type]}</span> ${esc(r.name)}</div>`).join('')
      : '<div class="empty">Aucune recette trouvée.</div>';
    ov.querySelectorAll('.pickitem').forEach(p=>{ p.onclick = ()=>setEntry({ rid: p.dataset.id }); });
  }
  renderPick('');
  document.getElementById('p-q').oninput = e=>renderPick(e.target.value);
  document.getElementById('p-ok').onclick = ()=>{
    const t = document.getElementById('p-txt').value.trim();
    if(t) setEntry({ txt: t });
  };
  if(existing) document.getElementById('p-rm').onclick = ()=>setEntry(null);
  document.getElementById('p-close').onclick = ()=>goBack();
}

/* ============ listes de stockage (frigo, congel, placard, autre) ============ */
function listScreen(kind){
  leaveCook(); closeOverlay();
  if(!STORES[kind]) kind = 'frigo';
  pushScreen({ screen:'list', kind:kind });
  app.innerHTML = '';
  app.appendChild(topbar(STORES[kind].ico+' '+STORES[kind].lbl));
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="addrow">
      <input type="text" id="l-add" placeholder="Article…" style="flex:2;min-width:0">
      <input type="text" id="l-qty" placeholder="Qté (2, 500 g…)" style="flex:1.3;min-width:0">
      <button id="l-ok">+</button>
    </div>
    <div class="card" id="l-list"></div>
    <p class="note" style="margin-top:10px">Touche un article pour modifier son nom ou sa quantité. ⇄ le déplace vers une autre liste, 🛒 l'envoie dans la liste de courses.</p>`;
  app.appendChild(box);
  let editIdx = null;
  function arr(){ return stores[kind]; }
  function persist(){ lsSet('stores', stores); }
  function render(){
    const a = arr();
    const hasOther = Object.keys(STORES).some(x=>x!==kind && active[x]);
    document.getElementById('l-list').innerHTML = a.length
      ? a.map((it,k)=> k===editIdx
        ? `<div class="item">
            <input type="text" class="ed-n" value="${esc(it.n)}" style="flex:2;min-width:0">
            <input type="text" class="ed-q" value="${esc(it.q||'')}" placeholder="Qté" style="flex:1;min-width:0">
            <button class="iconbtn" id="ed-ok" style="background:var(--olive);border-color:var(--olive);color:#fff">✓</button>
          </div>`
        : `<div class="item" data-edit="${k}">
            <span class="nm">${esc(it.n)}</span>
            ${it.q ? `<span class="qy">${esc(it.q)}</span>` : ''}
            ${hasOther ? `<button class="iconbtn" data-move="${k}" title="Déplacer vers une autre liste">⇄</button>` : ''}
            <button class="iconbtn" data-buy="${k}" title="Ajouter aux courses">🛒</button>
            <button class="iconbtn del" data-rm="${k}">✕</button>
          </div>`).join('')
      : '<div class="empty">Rien pour l\u2019instant.<br>Ajoute ce que tu as en stock !</div>';
    document.querySelectorAll('#l-list [data-edit]').forEach(row=>{ row.onclick = e=>{
      if(e.target.closest('.iconbtn')) return;
      editIdx = +row.dataset.edit; render();
      const f = document.querySelector('#l-list .ed-q'); if(f){ f.focus(); f.select(); }
    }; });
    const ok = document.getElementById('ed-ok');
    if(ok){
      const commit = ()=>{
        const n = document.querySelector('#l-list .ed-n').value.trim();
        const q = document.querySelector('#l-list .ed-q').value.trim();
        if(n){ arr()[editIdx].n = n; }
        arr()[editIdx].q = q;
        persist(); editIdx = null; buzz(20); render();
      };
      ok.onclick = commit;
      document.querySelectorAll('#l-list .ed-n, #l-list .ed-q').forEach(i=>{ i.onkeydown = e=>{ if(e.key==='Enter') commit(); }; i.onfocus = ()=>i.select(); });
    }
    document.querySelectorAll('#l-list [data-rm]').forEach(b=>{ b.onclick = ()=>{
      arr().splice(+b.dataset.rm,1); persist(); editIdx = null; render(); }; });
    document.querySelectorAll('#l-list [data-buy]').forEach(b=>{ b.onclick = ()=>{
      const it = arr()[+b.dataset.buy];
      if(!it) return;
      if(courses.some(c=>!c.done && c.n.toLowerCase()===it.n.toLowerCase())){ toast('Déjà dans la liste de courses'); return; }
      courses.push({ n:it.n, done:false }); lsSet('courses', courses);
      buzz(25); b.textContent = '✓'; setTimeout(()=>{ b.textContent='🛒'; }, 1200);
    }; });
    document.querySelectorAll('#l-list [data-move]').forEach(b=>{ b.onclick = ()=>{
      const k = +b.dataset.move; const it = arr()[k];
      if(!it) return;
      storeSheet('Déplacer « '+it.n+' » vers…', kind, tgt=>{
        if(!stores[tgt].some(x=>x.n.toLowerCase()===it.n.toLowerCase())) stores[tgt].push({ n:it.n, q:it.q||'' });
        arr().splice(k,1); persist(); editIdx = null; buzz(25);
      });
    }; });
  }
  function add(){
    const inp = document.getElementById('l-add'), qin = document.getElementById('l-qty');
    const v = inp.value.trim();
    if(!v) return;
    if(arr().some(x=>x.n.toLowerCase()===v.toLowerCase())){ toast('Article déjà présent dans cette liste'); return; }
    arr().push({ n:v, q:qin.value.trim() }); persist();
    inp.value = ''; qin.value = ''; inp.focus(); editIdx = null; render();
  }
  document.getElementById('l-ok').onclick = add;
  document.getElementById('l-add').onkeydown = e=>{ if(e.key==='Enter') add(); };
  render();
}

/* ============ liste de courses ============ */
function coursesScreen(){
  leaveCook(); closeOverlay();
  pushScreen({ screen:'courses' });
  app.innerHTML = '';
  app.appendChild(topbar('Liste de courses'));
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="addrow"><input type="text" id="c-add" placeholder="Ajouter un article…"><button id="c-ok">+</button></div>
    <div class="card" id="c-list"></div>
    <button class="ghost" id="c-clear" style="margin-top:10px">Vider les articles cochés</button>
    <p class="note" style="margin-top:10px">🧺 = acheté : tu choisis où le ranger (frigo, congel, placard…) et l'article quitte la liste. Astuce : depuis une recette, « 🛒 + courses » ajoute tous ses ingrédients ici d'un coup.</p>`;
  app.appendChild(box);
  function render(){
    const sorted = courses.map((c,k)=>({c,k})).sort((a,b)=>(a.c.done?1:0)-(b.c.done?1:0));
    document.getElementById('c-list').innerHTML = courses.length
      ? sorted.map(({c,k})=>`<div class="item ${c.done?'done':''}">
          <button class="chk" data-k="${k}" style="width:26px;height:26px;border-radius:9px">${c.done?'✓':''}</button>
          <span class="nm">${esc(c.n)}</span>
          <button class="iconbtn" data-put="${k}" title="Acheté → ranger dans…">🧺</button>
          <button class="iconbtn del" data-rm="${k}">✕</button>
        </div>`).join('')
      : '<div class="empty">Liste vide.<br>Ajoute un article, ou les ingrédients d\u2019une recette !</div>';
    document.querySelectorAll('#c-list .chk').forEach(b=>{ b.onclick = ()=>{
      const k = +b.dataset.k; courses[k].done = !courses[k].done; lsSet('courses', courses); buzz(20); render(); }; });
    document.querySelectorAll('#c-list [data-put]').forEach(b=>{ b.onclick = ()=>{
      const k = +b.dataset.put; const it = courses[k];
      if(!it) return;
      storeSheet('Ranger « '+it.n+' » dans…', null, tgt=>{
        if(!stores[tgt].some(x=>x.n.toLowerCase()===it.n.toLowerCase())) stores[tgt].push({ n:it.n, q:'' });
        lsSet('stores', stores);
        courses.splice(k,1); lsSet('courses', courses);
        buzz(25);
      });
    }; });
    document.querySelectorAll('#c-list [data-rm]').forEach(b=>{ b.onclick = ()=>{
      courses.splice(+b.dataset.rm,1); lsSet('courses', courses); render(); }; });
  }
  function add(){
    const inp = document.getElementById('c-add');
    const v = inp.value.trim();
    if(!v) return;
    const ex = courses.find(c=>c.n.toLowerCase()===v.toLowerCase());
    if(ex){
      if(ex.done){ ex.done = false; lsSet('courses', courses); toast('« '+ex.n+' » remis dans la liste'); inp.value = ''; render(); }
      else { toast('Article déjà présent dans la liste'); }
      return;
    }
    courses.push({ n:v, done:false }); lsSet('courses', courses);
    inp.value = ''; inp.focus(); render();
  }
  document.getElementById('c-ok').onclick = add;
  document.getElementById('c-add').onkeydown = e=>{ if(e.key==='Enter') add(); };
  document.getElementById('c-clear').onclick = ()=>{
    courses = courses.filter(c=>!c.done); lsSet('courses', courses); render();
  };
  render();
}

/* ============ options ============ */
function settingsScreen(){
  leaveCook(); closeOverlay();
  pushScreen({ screen:'settings' });
  app.innerHTML = '';
  app.appendChild(topbar('Options'));
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="card">
      <div class="optrow">
        <div class="ot"><b>Vibration</b><span>Petites vibrations sur les actions et fin de minuterie</span></div>
        <button class="switch ${prefs.vib?'on':''}" data-p="vib"></button>
      </div>
      <div class="optrow">
        <div class="ot"><b>Son</b><span>Bip à la fin des minuteries</span></div>
        <button class="switch ${prefs.son?'on':''}" data-p="son"></button>
      </div>
      <div class="optrow">
        <div class="ot"><b>Écran allumé en cuisine</b><span>Empêche la mise en veille pendant une recette</span></div>
        <button class="switch ${prefs.veille?'on':''}" data-p="veille"></button>
      </div>
    </div>
    <h2 class="sec">Mes listes de stockage</h2>
    <div class="card">
      ${Object.keys(STORES).map(k=>`
      <div class="optrow">
        <div class="ot"><b>${STORES[k].ico} ${STORES[k].lbl}</b></div>
        <button class="switch ${active[k]?'on':''}" data-st="${k}"></button>
      </div>`).join('')}
      <p class="note" style="margin-top:10px">Les listes activées apparaissent sur l'écran d'accueil et dans les choix de rangement. En désactiver une ne supprime pas son contenu.</p>
    </div>
    <h2 class="sec">Sauvegarde</h2>
    <div class="card">
      <button class="ghost" id="o-export" style="margin-bottom:8px">⬇️ Exporter mes données (.json)</button>
      <button class="ghost" id="o-import">⬆️ Importer une sauvegarde</button>
      <input type="file" id="o-file" accept=".json,application/json" style="display:none">
      <p class="note" style="margin-top:10px">Recettes, planning, frigo, congel et courses — tout est dans le fichier. Pratique pour changer de téléphone.</p>
    </div>`;
  app.appendChild(box);
  document.querySelectorAll('.switch[data-st]').forEach(s=>{ s.onclick = ()=>{
    const k = s.dataset.st; active[k] = !active[k]; lsSet('activeStores', active);
    s.classList.toggle('on', active[k]); buzz(20);
  }; });
  document.querySelectorAll('.switch[data-p]').forEach(s=>{ s.onclick = ()=>{
    const p = s.dataset.p; prefs[p] = !prefs[p]; savePref(p, prefs[p]);
    s.classList.toggle('on', prefs[p]);
    if(p==='vib' && prefs[p]) buzz(40);
    if(p==='son' && prefs[p]) beep(1);
  }; });
  document.getElementById('o-export').onclick = ()=>{
    const data = { app:'repas', version:2, exported:new Date().toISOString(),
      recipes, plan, stores, active, courses };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'repas-sauvegarde-' + isoDate(new Date()) + '.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  document.getElementById('o-import').onclick = ()=>document.getElementById('o-file').click();
  document.getElementById('o-file').onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        if(data.app!=='repas') throw new Error('format');
        if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
        recipes = Array.isArray(data.recipes)?data.recipes:[];
        plan = data.plan && typeof data.plan==='object' ? data.plan : {};
        if(data.stores && typeof data.stores==='object'){
          stores = data.stores;
        } else {
          stores = { frigo: Array.isArray(data.frigo)?data.frigo:[], congel: Array.isArray(data.congel)?data.congel:[], placard: [], autre: [] };
        }
        Object.keys(STORES).forEach(k=>{ if(!Array.isArray(stores[k])) stores[k] = []; });
        active = Object.assign({ frigo:true, congel:true, placard:false, autre:false }, data.active||{});
        courses = Array.isArray(data.courses)?data.courses:[];
        lsSet('recipes', recipes); lsSet('plan', plan); lsSet('stores', stores);
        lsSet('activeStores', active); lsSet('courses', courses);
        alert('Sauvegarde importée ✓');
        home();
      }catch(err){ alert('Ce fichier n\u2019est pas une sauvegarde repas. valide.'); }
    };
    rd.readAsText(f);
  };
}

/* ============ démarrage ============ */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
fromPop = true;
home();
